<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>my calculator</title>
    <link rel="stylesheet" href="./css/calculator.css">
</head>
<body>
    <div class="container">
        <p>my calculator</p>
        <div class="calculator">
            <div class="display">0</div>
            <div class="keys">
                <button class="key-operator1" data-action="clear">AC</button>
                <button class="key-operator1" data-action="percent">%</button>
                <button class="key-operator1">del</button>
                <button class="key-operator2" data-action="divide">&divide</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="key-operator2" data-action="multiply">&times</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="key-operator2" data-action="subtract">-</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="key-operator2" data-action="add">+</button>
                <button class="key-zero">0</button>
                <button data-action="decimal">.</button>
                <button class="key-operator2" data-action="equal">=</button>
            </div>
        </div>
    </div>
    <script src="js/calculator.js"></script>
</body>
</html>
